name: ots-backfill
# One-off (Oct 12): commit the 2026-10-10 and 2026-10-11 .ots stamps that the web upload flow refused (HTTP 400 x4).
# Delete this file after a successful run.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  commit-ots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: write .ots files
        run: |
          echo "" | base64 -d > anchors/2026-10-10.txt.ots
          echo "" | base64 -d > anchors/2026-10-11.txt.ots
          sha256sum anchors/2026-10-10.txt.ots anchors/2026-10-11.txt.ots
      - name: commit
        run: |
          git config user.name "soto-anchors[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add anchors/2026-10-10.txt.ots anchors/2026-10-11.txt.ots
          git commit -m "backfill .ots stamps for 2026-10-10 and 2026-10-11 anchors"
          git push
